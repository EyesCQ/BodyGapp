<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101722">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Antrenman Takip</title>
<style>
:root{--bg:#101722;--card:#182131;--in:#0d131c;--line:#26334a;--tx:#eef2f8;--mu:#8393ad;--ac:#5ad1e6;--warn:#ffb454;--red:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark}
body{margin:0 auto;max-width:520px;color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 110px)}
h1{font-size:26px;margin:2px 0 0;letter-spacing:-.5px}
.sub{color:var(--mu);font-size:14px;text-transform:capitalize}
.tabs{display:flex;gap:8px;margin:16px 0 8px}
button{font:inherit;color:inherit;cursor:pointer}
.tabs button{flex:1;padding:12px 4px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600}
.tabs .on{background:var(--ac);border-color:var(--ac);color:#06222a}
.sum{display:flex;justify-content:space-between;color:var(--mu);font-size:14px;margin:12px 2px}
.sum b{color:var(--tx)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ch b{font-size:17px}
.x,.rm{background:none;border:0;color:var(--mu);font-size:18px;padding:6px 8px;border-radius:8px}
.x:active,.rm:active{color:var(--red)}
.last{color:var(--ac);font-size:13px;margin:2px 0 6px}
.row{display:grid;grid-template-columns:22px 1fr 1fr 34px;gap:8px;align-items:center;margin-top:8px}
.row span{color:var(--mu);font-size:14px;text-align:center}
.cap{display:grid;grid-template-columns:22px 1fr 1fr 34px;gap:8px;color:var(--mu);font-size:12px;text-align:center}
input[type=text]{width:100%;background:var(--in);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px 6px;font-size:16px;text-align:center;outline:0}
input[type=text]:focus{border-color:var(--ac)}
input::placeholder{color:#4a5a75}
.ft{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--mu);flex-wrap:wrap}
.ft b{color:var(--tx);font-size:15px}
.ft .as{margin-left:auto;background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--ac);font-weight:600}
.add{display:flex;gap:8px;margin:4px 0 22px}
.add input{text-align:left;padding:12px}
.add button,.bk button,.bk label{background:var(--ac);color:#06222a;border:0;border-radius:10px;padding:12px 16px;font-weight:700;text-align:center}
.bk{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.bk button,.bk label{background:var(--card);color:var(--tx);border:1px solid var(--line);font-weight:600;font-size:15px}
.bk label{grid-column:1/-1;color:var(--ac)}
h2{font-size:15px;color:var(--mu);margin:6px 2px;font-weight:600}
.tbar{position:fixed;left:0;right:0;bottom:0;background:rgba(16,23,34,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 10px)}
.ti{max-width:520px;margin:0 auto;display:flex;gap:8px;align-items:center}
#tm{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;min-width:84px}
.ti button{flex:1;padding:13px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700}
.ti button.on{background:var(--ac);color:#06222a;border-color:var(--ac)}
.ti #stop{flex:0 0 46px;color:var(--mu)}
.tbar.done{background:var(--warn)}.tbar.done #tm{color:#2a1a00}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translate(-50%,-80px);background:var(--tx);color:#101722;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;transition:transform .25s;z-index:9}
#toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<h1 id="title"></h1>
<div class="sub" id="date"></div>
<div class="tabs">
  <button data-d="1">Pzt</button><button data-d="3">Çar</button><button data-d="5">Cum</button>
</div>
<div class="sum"><span>Bugünkü toplam hacim</span><b id="total">0 kg</b></div>
<div id="list"></div>
<form class="add" id="addf">
  <input type="text" id="newEx" placeholder="Yeni hareket ekle" autocomplete="off" enterkeyhint="done">
  <button type="submit">Ekle</button>
</form>
<h2>Yedekleme</h2>
<div class="bk">
  <button id="ej">JSON indir</button><button id="ec">CSV indir</button>
  <label>JSON yedeği geri yükle<input type="file" id="imp" accept=".json,application/json" hidden></label>
</div>

<div class="tbar" id="tbar"><div class="ti">
  <span id="tm">00:00</span>
  <button data-s="60">60</button><button data-s="90">90</button><button data-s="120">120</button>
  <button id="stop" aria-label="Sayacı durdur">✕</button>
</div></div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const KEY='spor-takip-v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TITLES={1:'Göğüs / Ön Kol',3:'Sırt / Arka Kol',5:'Bacak / Omuz'};
const DEF={
 1:['Bench Press','Eğimli Dumbbell Press','Kablo Fly','Barbell Curl','Çekiç Curl'],
 3:['Lat Pulldown','Barbell Row','Oturarak Kablo Row','Triceps Pushdown','Skull Crusher'],
 5:['Squat','Leg Press','Romanian Deadlift','Omuz Press','Yan Kaldırış']};
function fresh(){const prog={},names={};for(const d in DEF)prog[d]=DEF[d].map(n=>{const id=uid();names[id]=n;return id});return{prog,names,logs:{}}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.prog||!S.names||!S.logs)S=fresh();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Kaydedilemedi, tarayıcı hafızası dolu veya kapalı')}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}

const today=()=>new Date().toLocaleDateString('sv-SE');
let day=[1,1,3,3,5,5,1][new Date().getDay()];
const valid=s=>+s.k>0&&+s.r>0;
const vol=a=>a.filter(valid).reduce((t,s)=>t+s.k*s.r,0);
const rm=a=>a.filter(valid).reduce((m,s)=>Math.max(m,+s.r===1?+s.k:s.k*(1+s.r/30)),0);
const f1=n=>(Math.round(n*10)/10).toLocaleString('tr-TR');
function sets(id){const t=today(),L=S.logs[t]||(S.logs[t]={});return L[id]||(L[id]=[{k:'',r:''},{k:'',r:''},{k:'',r:''}])}
function last(id){const t=today();
  const ds=Object.keys(S.logs).filter(d=>d<t&&S.logs[d][id]&&S.logs[d][id].some(valid)).sort();
  if(!ds.length)return null;const d=ds[ds.length-1];
  const v=S.logs[d][id].filter(valid);
  return{d,n:v.length,b:v.reduce((a,s)=>+s.k>=+a.k?s:a)}}

function rowH(s,i,L){return `<div class="row"><span>${i+1}</span>
 <input type="text" inputmode="decimal" data-i="${i}" data-f="k" value="${esc(s.k)}" placeholder="${L?L.b.k:'0'}" aria-label="Ağırlık kg">
 <input type="text" inputmode="numeric" data-i="${i}" data-f="r" value="${esc(s.r)}" placeholder="${L?L.b.r:'0'}" aria-label="Tekrar">
 <button class="rm" data-a="rs" data-i="${i}" aria-label="Seti sil">−</button></div>`}

function render(){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.d===day));
  $('#title').textContent=TITLES[day];
  $('#date').textContent=new Date().toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'});
  const ids=S.prog[day];
  $('#list').innerHTML=ids.length?ids.map(id=>{
    const L=last(id),a=sets(id);
    const lt=L?`Son antrenman (${new Date(L.d+'T12:00').toLocaleDateString('tr-TR',{day:'numeric',month:'short'})}): ${L.b.k} kg × ${L.b.r} tekrar, ${L.n} set`:'İlk kez, henüz kayıt yok';
    return `<div class="card" data-id="${id}">
      <div class="ch"><b>${esc(S.names[id]||'Hareket')}</b><button class="x" data-a="del" aria-label="Hareketi sil">✕</button></div>
      <div class="last">${lt}</div>
      <div class="cap"><span>Set</span><span>Kg</span><span>Tekrar</span><span></span></div>
      ${a.map((s,i)=>rowH(s,i,L)).join('')}
      <div class="ft"><span>Hacim <b class="v"></b></span><span>1RM <b class="m"></b></span><button class="as" data-a="as">+ Set</button></div>
    </div>`}).join(''):'<div class="sub" style="text-align:center;padding:24px">Bu gün için hareket yok. Aşağıdan ekle.</div>';
  upd();
}
function upd(){let T=0;
  document.querySelectorAll('.card').forEach(c=>{const a=sets(c.dataset.id),v=vol(a),m=rm(a);T+=v;
    c.querySelector('.v').textContent=f1(v)+' kg';c.querySelector('.m').textContent=m?f1(m)+' kg':'–'});
  $('#total').textContent=f1(T)+' kg'}

$('#list').addEventListener('input',e=>{const i=e.target;if(!i.dataset.f)return;
  sets(i.closest('.card').dataset.id)[+i.dataset.i][i.dataset.f]=i.value.replace(',','.');save();upd()});
$('#list').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const id=b.closest('.card').dataset.id,a=b.dataset.a;
  if(a==='as'){const s=sets(id),p=s[s.length-1];s.push({k:p.k,r:p.r})}
  else if(a==='rs'){const s=sets(id);if(s.length>1)s.splice(+b.dataset.i,1)}
  else if(a==='del'){if(!confirm('“'+S.names[id]+'” programdan silinsin mi? Geçmiş kayıtların korunur.'))return;S.prog[day]=S.prog[day].filter(x=>x!==id)}
  save();render()});
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){day=+b.dataset.d;render()}});
$('#addf').addEventListener('submit',e=>{e.preventDefault();
  const n=$('#newEx').value.trim();if(!n)return;
  const id=uid();S.names[id]=n;S.prog[day].push(id);$('#newEx').value='';save();render()});

/* Dinlenme sayacı */
let end=0,iv=null,ac;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function beep(){try{[0,.4,.8].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+t;
  o.frequency.value=880;o.connect(g);g.connect(ac.destination);
  g.gain.setValueAtTime(.35,n);g.gain.exponentialRampToValueAtTime(.001,n+.3);o.start(n);o.stop(n+.3)})}catch(e){}}
function stop(){clearInterval(iv);iv=null;document.querySelectorAll('.ti [data-s]').forEach(b=>b.classList.remove('on'))}
function tick(){const l=Math.ceil((end-Date.now())/1000);
  if(l<=0){stop();$('#tm').textContent='00:00';const bar=$('#tbar');bar.classList.add('done');
    beep();if(navigator.vibrate)navigator.vibrate([400,150,400,150,400]);
    setTimeout(()=>bar.classList.remove('done'),3000);return}
  $('#tm').textContent=fmt(l)}
document.querySelectorAll('.ti [data-s]').forEach(b=>b.onclick=()=>{
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}
  stop();b.classList.add('on');end=Date.now()+b.dataset.s*1000;tick();iv=setInterval(tick,250)});
$('#stop').onclick=()=>{stop();$('#tm').textContent='00:00'};
document.addEventListener('visibilitychange',()=>{if(iv)tick()});

/* Yedekleme */
function dl(name,text,type){const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function clean(){const logs={};
  for(const d in S.logs){const o={};for(const id in S.logs[d]){const v=S.logs[d][id].filter(valid);if(v.length)o[id]=v}
    if(Object.keys(o).length)logs[d]=o}
  return{app:'spor-takip',v:1,prog:S.prog,names:S.names,logs}}
$('#ej').onclick=()=>dl('spor-yedek-'+today()+'.json',JSON.stringify(clean(),null,2),'application/json');
$('#ec').onclick=()=>{const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const rows=['Tarih,Hareket,Set,Kg,Tekrar,Hacim,1RM'],c=clean();
  Object.keys(c.logs).sort().forEach(d=>{for(const id in c.logs[d])c.logs[d][id].forEach((s,i)=>
    rows.push([d,q(S.names[id]||id),i+1,s.k,s.r,f1c(s.k*s.r),f1c(+s.r===1?+s.k:s.k*(1+s.r/30))].join(',')))});
  dl('spor-yedek-'+today()+'.csv','\ufeff'+rows.join('\n'),'text/csv;charset=utf-8')};
const f1c=n=>String(Math.round(n*10)/10);
$('#imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());
    if(!d.names||!d.logs||![1,3,5].every(k=>d.prog&&Array.isArray(d.prog[k])))throw 0;
    if(!confirm('Mevcut veriler yedekteki verilerle değiştirilsin mi?'))return;
    S={prog:d.prog,names:d.names,logs:d.logs};save();render();toast('Yedek yüklendi')}
  catch(x){toast('Geçersiz yedek dosyası')}
  e.target.value=''};

render();
</script>
</body>
</html>
