<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1018">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>BodyGapp — Sporcu Takip Sistemi</title>
<style>
:root{
  --bg:#0b1018;
  --bg-elev:#101824;
  --card:#131c2b;
  --card-2:#182336;
  --in:#090e16;
  --line:rgba(148,175,214,.14);
  --line-strong:rgba(148,175,214,.26);
  --tx:#f1f5fb;
  --mu:#8d9db5;
  --mu-2:#5f708a;
  --ac:#38bdf8;
  --ac-soft:rgba(56,189,248,.14);
  --ac-ink:#041b26;
  --ok:#34d399;
  --ok-soft:rgba(52,211,153,.14);
  --warn:#fbbf24;
  --warn-soft:rgba(251,191,36,.14);
  --red:#f87171;
  --red-soft:rgba(248,113,113,.14);
  --r-lg:18px;
  --r-md:14px;
  --r-sm:10px;
  --shadow:0 12px 32px rgba(0,0,0,.35)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{
  min-height:100%;
  background:
    radial-gradient(120% 45% at 50% 35%,rgba(56,189,248,.16) 0%,rgba(56,189,248,0) 68%),
    var(--bg);
  color-scheme:dark
}
body{
  margin:0 auto;
  max-width:520px;
  color:var(--tx);
  font:400 15.5px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 14px calc(env(safe-area-inset-bottom,0px) + 44px);
  font-variant-numeric:tabular-nums
}
h1{font-size:24px;font-weight:700;margin:0;letter-spacing:-.025em;line-height:1.2}
.sub{color:var(--mu);font-size:13.5px;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer;transition:background-color .16s ease,border-color .16s ease,color .16s ease,transform .08s ease}
button:active:not(:disabled){transform:scale(.985)}

/* Karşılama / Açılış Ekranı */
#intro{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 24px) 24px calc(env(safe-area-inset-bottom,0px) + 24px);
  background:
    radial-gradient(90% 50% at 50% 45%,rgba(56,189,248,.18) 0%,rgba(56,189,248,0) 70%),
    var(--bg);
  cursor:pointer
}
#intro[hidden]{display:none}
.in-center{
  text-align:center;
  max-width:380px;
  padding:28px 22px;
  border-radius:24px;
  background:rgba(19,28,43,.72);
  border:1px solid var(--line-strong);
  box-shadow:0 20px 50px rgba(0,0,0,.45);
  -webkit-backdrop-filter:blur(14px);
  backdrop-filter:blur(14px)
}
.in-welcome{
  margin:0;
  font-size:clamp(26px,6.5vw,34px);
  font-weight:800;
  line-height:1.22;
  letter-spacing:-.03em;
  background:linear-gradient(135deg,#ffffff 15%,#7dd3fc 65%,var(--ac) 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent
}
.in-enter{
  margin-top:18px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:9px 18px;
  border-radius:999px;
  border:1px solid rgba(56,189,248,.32);
  background:var(--ac-soft);
  color:var(--ac);
  font-size:13px;
  font-weight:700
}
.in-corner{
  position:fixed;
  right:calc(env(safe-area-inset-right,0px) + 18px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  font-size:12px;
  font-weight:650;
  letter-spacing:.04em;
  color:var(--mu)
}

/* Üst başlık */
.hd{display:flex;align-items:center;gap:12px;margin-bottom:4px;flex-wrap:wrap}
.lg{
  width:38px;height:38px;flex:none;
  display:grid;place-items:center;
  border-radius:12px;
  background:linear-gradient(145deg,rgba(56,189,248,.18),rgba(56,189,248,.05));
  border:1px solid rgba(56,189,248,.28);
  color:var(--ac)
}
.brand-inline{
  display:flex;
  align-items:baseline;
  gap:8px;
  flex-wrap:wrap
}
.sys-label{
  font-size:13.5px;
  font-weight:600;
  color:var(--mu);
  letter-spacing:-.01em
}
#date{margin-left:50px}

/* Üst segment kontrolü */
.seg{
  display:grid;grid-template-columns:repeat(3,1fr);gap:4px;
  background:var(--bg-elev);
  border:1px solid var(--line);
  border-radius:var(--r-md);
  padding:4px;
  margin:14px 0 12px;
  box-shadow:var(--shadow)
}
.seg button{
  border:1px solid transparent;
  background:transparent;
  padding:9px 8px;
  border-radius:10px;
  font-weight:600;
  font-size:14px;
  color:var(--mu)
}
.seg .on{
  background:var(--card-2);
  border-color:var(--line-strong);
  color:var(--tx);
  box-shadow:0 2px 8px rgba(0,0,0,.25)
}

/* Dinlenme sayacı */
.tmr{
  position:sticky;
  top:calc(env(safe-area-inset-top,0px) + 8px);
  z-index:10;
  background:rgba(19,28,43,.88);
  -webkit-backdrop-filter:blur(16px);
  backdrop-filter:blur(16px);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  padding:10px 12px;
  margin-bottom:12px;
  box-shadow:var(--shadow)
}
.tmr.run{border-color:rgba(56,189,248,.48)}
.tt{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:0 2px 8px}
.ti{display:flex;gap:7px;align-items:center}
.tg{width:54px;height:54px;flex:none}
#tm{fill:var(--tx);font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.rb{fill:none;stroke:rgba(148,175,214,.16);stroke-width:4.5}
.rf{fill:none;stroke:var(--ac);stroke-width:4.5;stroke-linecap:round;transition:stroke-dasharray .2s linear}
.ti button{
  flex:1;
  padding:11px 0;
  border-radius:var(--r-sm);
  border:1px solid var(--line);
  background:var(--bg-elev);
  font-weight:700;
  font-size:14px;
  color:var(--tx)
}
.ti button.on{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}
.ti #stop{flex:0 0 42px;color:var(--mu);font-size:14px}

/* Haftalık halka özet */
.wk{
  display:flex;align-items:center;gap:14px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  padding:13px 15px;
  margin-bottom:14px
}
.wk b{font-size:15px;font-weight:700;display:block}
.rg{width:54px;height:54px;flex:none}
.rg .rb,.rg .rf{stroke-width:5.5}
.rg text{fill:var(--tx);font-size:13px;font-weight:700}
.ht{color:var(--mu);font-size:13.5px;margin-top:2px}

/* Gün başlığı ve sekmeler */
#dh{font-size:16.5px;font-weight:700;color:var(--tx);margin:4px 2px 10px;letter-spacing:-.015em}
.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:10px}
.tabs button{
  padding:8px 0 6px;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--card);
  font-weight:600;
  font-size:13px;
  color:var(--mu)
}
.tabs small{display:block;font-size:11.5px;height:15px;margin-top:2px;color:var(--mu-2)}
.tabs .on{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}
.tabs .on small{color:var(--ac-ink);font-weight:700}
.tabs .ok small{color:var(--ok)}
.tabs .no small{color:var(--red)}
.tabs .on.ok small,.tabs .on.no small{color:var(--ac-ink)}

/* Girdiler */
.tin{
  width:100%;
  background:var(--card);
  border:1px solid var(--line);
  color:var(--tx);
  border-radius:var(--r-md);
  padding:12px 14px;
  font-size:16px;
  font-weight:600;
  outline:0;
  transition:border-color .16s ease,box-shadow .16s ease
}
.tin:focus,input[type=text]:focus{
  border-color:var(--ac);
  box-shadow:0 0 0 3px rgba(56,189,248,.14)
}

/* Durum butonu & Off day */
.stb{display:flex;gap:8px;margin:10px 0;align-items:center}
.stb button{
  flex:1;
  padding:12px 14px;
  border-radius:var(--r-md);
  border:1px solid var(--line);
  background:var(--card);
  font-weight:600;
  font-size:14.5px
}
.stb button:disabled{opacity:.48;cursor:not-allowed}
.stb .on{background:var(--ok);border-color:var(--ok);color:#042419}
.stb .off{background:var(--red-soft);border-color:rgba(248,113,113,.35);color:var(--red)}
.offtag{
  display:block;
  background:rgba(148,175,214,.06);
  color:var(--mu);
  border:1px dashed var(--line-strong);
  border-radius:var(--r-md);
  padding:10px 12px;
  font-size:13px;
  font-weight:600;
  margin:10px 0;
  text-align:center
}

/* Özet satırı */
.sum{
  display:flex;justify-content:space-between;align-items:center;
  color:var(--mu);font-size:13.5px;margin:12px 4px 10px
}
.sum b{color:var(--tx);font-size:15px;font-weight:700}

/* Hareket kartları */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 6px 20px rgba(0,0,0,.22)
}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ch b{font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.x,.rm{
  background:transparent;
  border:1px solid transparent;
  color:var(--mu);
  font-size:16px;
  width:32px;height:32px;
  display:grid;place-items:center;
  border-radius:9px
}
.x:hover,.rm:hover{background:rgba(148,175,214,.08);color:var(--tx)}
.x:active,.rm:active{color:var(--red);background:var(--red-soft)}
.last{color:var(--ac);font-size:12.5px;font-weight:500;margin:3px 0 8px}
.row,.cap{display:grid;grid-template-columns:24px 1fr 1fr 32px;gap:8px;align-items:center}
.row{margin-top:8px}
.row span{color:var(--mu-2);font-size:13px;font-weight:600;text-align:center}
.cap{color:var(--mu-2);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;text-align:center}
input[type=text]{
  width:100%;
  background:var(--in);
  border:1px solid var(--line);
  color:var(--tx);
  border-radius:var(--r-sm);
  padding:10px 6px;
  font-size:15.5px;
  font-weight:600;
  text-align:center;
  outline:0
}
input::placeholder{color:var(--mu-2);font-weight:500}
.ft{
  display:flex;align-items:center;gap:12px;
  margin-top:12px;padding-top:10px;
  border-top:1px solid var(--line);
  font-size:12.5px;color:var(--mu);flex-wrap:wrap
}
.ft b{color:var(--tx);font-size:14.5px;font-weight:700}
.ft .as{
  margin-left:auto;
  background:var(--ac-soft);
  border:1px solid rgba(56,189,248,.28);
  border-radius:var(--r-sm);
  padding:7px 12px;
  color:var(--ac);
  font-weight:600;
  font-size:13px
}
.ft .as:hover{background:rgba(56,189,248,.22)}

/* Yeni hareket ekleme */
.add{display:flex;gap:8px;margin:6px 0 24px}
.add input{text-align:left;padding:12px 14px;background:var(--card)}
.add button{
  background:var(--ac);
  color:var(--ac-ink);
  border:0;
  border-radius:var(--r-sm);
  padding:0 18px;
  font-weight:700;
  font-size:14.5px;
  white-space:nowrap
}

/* Geçmiş ve rozetler */
.hr{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r-md);
  padding:12px 14px;
  margin-bottom:8px
}
.hr .d{color:var(--mu);font-size:12.5px;font-weight:500;margin-left:6px}
.bd{
  font-size:12px;font-weight:700;
  padding:5px 10px;border-radius:999px;
  white-space:nowrap;border:1px solid transparent
}
.bd.done{color:var(--ok);background:var(--ok-soft);border-color:rgba(52,211,153,.28)}
.bd.skip{color:var(--red);background:var(--red-soft);border-color:rgba(248,113,113,.28)}
.bd.miss{color:var(--mu);background:rgba(148,175,214,.08);border-color:var(--line)}
.bd.wait{color:var(--warn);background:var(--warn-soft);border-color:rgba(251,191,36,.28)}
.bd.off{color:var(--mu);background:rgba(148,175,214,.05);border-color:var(--line-strong);border-style:dashed}

h2{
  font-size:12.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;
  color:var(--mu);margin:14px 4px 8px
}

/* Yedekleme */
.bk{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.bk button,.bk label{
  background:var(--card);color:var(--tx);
  border:1px solid var(--line);border-radius:12px;
  padding:12px;font-weight:600;font-size:14.5px;text-align:center
}
.bk button:hover,.bk label:hover{border-color:var(--line-strong);background:var(--card-2)}
.bk label{grid-column:1/-1;color:var(--ac)}
.bk .qb{
  grid-column:1/-1;
  background:var(--ac);border-color:var(--ac);
  color:var(--ac-ink);font-weight:700
}
.bk .qb:hover{background:#52c7fa}
.bk #ec{grid-column:1/-1}
#lb{grid-column:1/-1;text-align:center;margin:2px 0}

/* Alarm modal ve toast */
#ov{
  position:fixed;inset:0;
  background:rgba(6,10,16,.84);
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;
  z-index:30;padding:24px
}
#ov[hidden]{display:none}
.ovb{
  background:var(--card);
  border:1.5px solid rgba(251,191,36,.55);
  border-radius:22px;
  padding:28px 24px;
  text-align:center;width:100%;max-width:340px;
  box-shadow:var(--shadow)
}
.ovt{font-size:24px;font-weight:800;color:var(--warn);margin-bottom:6px}
.ovb button{
  margin-top:20px;width:100%;padding:14px;
  border:0;border-radius:14px;
  background:var(--warn);color:#241500;
  font-size:16px;font-weight:800
}
#toast{
  position:fixed;left:50%;
  top:calc(env(safe-area-inset-top,0px) + 12px);
  transform:translate(-50%,-90px);
  background:var(--card-2);
  color:var(--tx);
  border:1px solid var(--line-strong);
  padding:10px 16px;
  border-radius:12px;
  font-weight:600;font-size:13.5px;
  transition:transform .24s ease;
  z-index:25;
  box-shadow:var(--shadow)
}
#toast.show{transform:translate(-50%,0)}

/* Değişim rozetleri ve ısı haritası */
.dl{font-weight:700;font-size:12.5px}
.dl.up{color:var(--ok)}
.dl.dn{color:var(--warn)}
.hm,.hmh{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.hmh{margin-bottom:6px}
.hmh span{text-align:center;font-size:11px;font-weight:600;color:var(--mu-2)}
.hm i{aspect-ratio:1;border-radius:7px;background:var(--in);border:1px solid var(--line)}
.hm .ok{background:var(--ok);border-color:var(--ok)}
.hm .no{background:var(--red);border-color:var(--red)}
.hm .ms{background:transparent;border:1px dashed var(--mu-2)}
.hm .td{border-color:var(--warn)}
.hm .fu{opacity:.28}
.hm .od{background:rgba(148,175,214,.08);border-style:dashed;border-color:var(--line-strong)}
.lgd{display:flex;gap:12px;margin-top:12px;font-size:12px;color:var(--mu);flex-wrap:wrap}
.lgd span::before{
  content:"";display:inline-block;width:10px;height:10px;border-radius:3px;
  margin-right:5px;vertical-align:-1px;background:var(--ok)
}
.lgd .no::before{background:var(--red)}
.lgd .ms::before{background:none;border:1px dashed var(--mu-2)}
.lgd .od::before{background:rgba(148,175,214,.08);border:1px dashed var(--line-strong)}

/* Haftalık Kıyas, Yorum/Öneriler ve Kayıtlı Özetler */
.cmp-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
.cmp-top b{font-size:16px;font-weight:700;letter-spacing:-.01em}
.cmp-metric{margin-bottom:13px}
.cmp-row-hd{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:6px;gap:8px}
.cmp-row-hd span{color:var(--mu);font-weight:500}
.cmp-bars{display:grid;gap:6px}
.bar-line{display:grid;grid-template-columns:58px 1fr auto;gap:8px;align-items:center;font-size:12px}
.bar-lbl{color:var(--mu-2);font-weight:600}
.bar-track{height:9px;background:var(--in);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--ac),#7dd3fc);transition:width .28s ease}
.bar-fill.prev{background:rgba(148,175,214,.32)}
.bar-val{font-weight:700;font-variant-numeric:tabular-nums;color:var(--tx)}
.adv-box{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.adv-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ac);margin-bottom:7px}
.adv-list{margin:0;padding-left:16px;display:grid;gap:6px;font-size:13px;color:var(--tx)}
.adv-list li::marker{color:var(--ac)}
.wk-log-item{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r-md);
  padding:12px 14px;
  margin-bottom:8px
}
.wk-log-hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wk-log-hd b{font-size:14px;font-weight:700}
.wk-log-meta{color:var(--mu);font-size:13px;margin-top:4px}
.wk-log-meta b{color:var(--tx);font-weight:600}
</style>
</head>
<body>

<section id="intro" aria-label="Açılış Ekranı">
  <div class="in-center">
    <p class="in-welcome">BodyGapp'e Hoşgeldin Ramazan</p>
    <button type="button" class="in-enter" id="startApp">Devam Et</button>
  </div>
  <span class="in-corner">Made By Ramo</span>
</section>

<div id="app" hidden>
  <div class="hd">
    <div class="lg" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round">
        <path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>
      </svg>
    </div>
    <div class="brand-inline">
      <h1>BodyGapp</h1>
      <span class="sys-label">Sporcu Takip Sistemi</span>
    </div>
  </div>
  <div class="sub" id="date"></div>
  <div class="seg" id="seg">
    <button type="button" data-v="w" class="on">Antrenman</button>
    <button type="button" data-v="h">Geçmiş</button>
    <button type="button" data-v="b">Yedek</button>
  </div>

  <div id="wv">
    <div class="tmr" id="tmr">
      <div class="tt">Dinlenme Sayacı</div>
      <div class="ti">
        <svg class="tg" viewBox="0 0 56 56"><circle cx="28" cy="28" r="24" class="rb"/><circle id="tr" cx="28" cy="28" r="24" class="rf" transform="rotate(-90 28 28)" stroke-dasharray="0 151"/><text id="tm" x="28" y="32.5" text-anchor="middle">00:00</text></svg>
        <button type="button" data-s="60">60</button><button type="button" data-s="90">90</button><button type="button" data-s="120">120</button>
        <button type="button" id="stop" aria-label="Sayacı durdur">✕</button>
      </div>
    </div>
    <div class="wk" id="wk"></div>
    <h2 id="dh"></h2>
    <div class="tabs" id="tabs"></div>
    <input type="text" class="tin" id="wt" placeholder="Antrenman adı (boşsa Off day)" autocomplete="off">
    <div id="st"></div>
    <div class="sum"><span>Bu günün toplam hacmi</span><b id="total">0 kg</b></div>
    <div id="list"></div>
    <form class="add" id="addf">
      <input type="text" id="newEx" placeholder="Bu güne yeni hareket ekle" autocomplete="off" enterkeyhint="done">
      <button type="submit">Ekle</button>
    </form>
  </div>

  <div id="hv" hidden>
    <div id="cmp" class="card"></div>
    <div id="hm" class="card"></div>
    <div class="sum"><span id="hs"></span></div>
    <div id="hl"></div>
    <h2>Kaydedilen Haftalık Özetler</h2>
    <div id="wkl"></div>
  </div>

  <div id="bv" hidden>
    <h2>Yedekleme</h2>
    <div class="bk">
      <button type="button" id="ej" class="qb">Güncel yedeği indir (JSON)</button>
      <div class="sub" id="lb"></div>
      <button type="button" id="ec">CSV indir</button>
      <label>JSON yedeği geri yükle<input type="file" id="imp" accept=".json,application/json" hidden></label>
    </div>
  </div>
</div>

<div id="ov" hidden><div class="ovb"><div class="ovt">Dinlenme bitti</div><div class="sub">Sıradaki sete geçebilirsin</div><button type="button" id="ovok">Tamam</button></div></div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const KEY = 'spor-takip-v3';
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DN = ['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
const DF = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const ORDER = [1,2,3,4,5,6,0];

const DEF = {};

function fmtD(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
const today = () => fmtD(new Date());

function fresh() {
  const days = {}, names = {};
  for (let d = 0; d < 7; d++) days[d] = {title: '', ids: []};
  for (const d in DEF) {
    days[d].title = DEF[d][0];
    days[d].ids = DEF[d][1].map(n => {
      const id = uid();
      names[id] = n;
      return id;
    });
  }
  return {days, names, logs: {}, done: {}, weekly: {}, since: today()};
}

function isOffDay(dow, state) {
  const obj = state && state.days ? state.days[dow] : null;
  if (!obj) return true;
  const hasTitle = String(obj.title || '').trim().length > 0;
  const hasIds = Array.isArray(obj.ids) && obj.ids.length > 0;
  return !hasTitle && !hasIds;
}

const valid = s => s && Number(s.k) > 0 && Number(s.r) > 0;
const vol = a => Array.isArray(a) ? a.filter(valid).reduce((t, s) => t + Number(s.k) * Number(s.r), 0) : 0;
const rm = a => Array.isArray(a) ? a.filter(valid).reduce((m, s) => {
  const k = Number(s.k), r = Number(s.r);
  return Math.max(m, r === 1 ? k : k * (1 + r / 30));
}, 0) : 0;
const f1 = n => (Math.round(n * 10) / 10).toLocaleString('tr-TR');

function syncPastMissed(state) {
  const td = today();
  const now = new Date();
  let changed = false;
  state.done = state.done || {};
  for (let i = 1; i <= 35; i++) {
    const dt = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
    const k = fmtD(dt);
    if (k >= td) continue;
    const dow = dt.getDay();
    if (isOffDay(dow, state)) continue;
    const ex = state.done[k];
    if (!ex) {
      state.done[k] = {s: 'skip', k: dow, t: state.days[dow].title || DF[dow], auto: true};
      changed = true;
    } else if (ex.s !== 'done' && ex.s !== 'skip') {
      state.done[k] = {s: 'skip', k: dow, t: ex.t || state.days[dow].title || DF[dow], auto: true};
      changed = true;
    }
  }
  return changed;
}

function getMondayDate(dateObj) {
  const off = (dateObj.getDay() + 6) % 7;
  return new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate() - off);
}

function buildWeekSummary(mondayDate, state) {
  const dates = [];
  for (let i = 0; i < 7; i++) {
    dates.push(fmtD(new Date(mondayDate.getFullYear(), mondayDate.getMonth(), mondayDate.getDate() + i)));
  }
  const start = dates[0];
  const endD = dates[6];
  const td = today();

  let doneCount = 0;
  let plannedCount = 0;
  let totalVol = 0;
  let peakRm = 0;

  dates.forEach(k => {
    const dt = new Date(k + 'T12:00:00');
    const dow = dt.getDay();
    const x = state.done && state.done[k];
    const off = isOffDay(dow, state);
    if (!off || (x && x.s === 'done')) plannedCount++;
    if (x && x.s === 'done') doneCount++;

    const dayLogs = (state.logs && state.logs[k]) || {};
    for (const id in dayLogs) {
      const arr = Array.isArray(dayLogs[id]) ? dayLogs[id] : [];
      totalVol += vol(arr);
      peakRm = Math.max(peakRm, rm(arr));
    }
  });

  const finished = td > endD;
  return {
    weekKey: start,
    start,
    end: endD,
    doneCount,
    plannedCount,
    totalVol: Math.round(totalVol * 10) / 10,
    peakRm: Math.round(peakRm * 10) / 10,
    finished,
    updatedAt: td
  };
}

function syncWeeklySnapshots(state) {
  state.weekly = state.weekly || {};
  const now = new Date();
  const curMon = getMondayDate(now);
  let changed = false;

  for (let w = 0; w < 8; w++) {
    const mon = new Date(curMon.getFullYear(), curMon.getMonth(), curMon.getDate() - w * 7);
    const sumObj = buildWeekSummary(mon, state);
    const prev = state.weekly[sumObj.weekKey];
    if (
      !prev ||
      prev.doneCount !== sumObj.doneCount ||
      prev.plannedCount !== sumObj.plannedCount ||
      prev.totalVol !== sumObj.totalVol ||
      prev.peakRm !== sumObj.peakRm ||
      prev.finished !== sumObj.finished
    ) {
      state.weekly[sumObj.weekKey] = sumObj;
      changed = true;
    }
  }
  return changed;
}

function mig(d) {
  if (!d || typeof d !== 'object') return null;
  d.names = typeof d.names === 'object' && d.names ? d.names : {};
  d.logs = typeof d.logs === 'object' && d.logs ? d.logs : {};
  if (!d.days || typeof d.days !== 'object') {
    d.days = {};
    for (let i = 0; i < 7; i++) {
      const legacyIds = d.prog && Array.isArray(d.prog[i]) ? d.prog[i] : [];
      d.days[i] = {title: '', ids: legacyIds};
    }
  }
  for (let i = 0; i < 7; i++) {
    d.days[i] = d.days[i] || {title: '', ids: []};
    if (!Array.isArray(d.days[i].ids)) d.days[i].ids = [];
    d.days[i].title = String(d.days[i].title || '');
  }
  d.done = typeof d.done === 'object' && d.done ? d.done : {};
  d.weekly = typeof d.weekly === 'object' && d.weekly ? d.weekly : {};
  d.since = d.since || Object.keys(d.logs).sort()[0] || today();
  return d;
}

let S = null;
try {
  S = mig(JSON.parse(localStorage.getItem(KEY)));
} catch (e) {
  S = null;
}
if (!S) S = fresh();
syncPastMissed(S);
syncWeeklySnapshots(S);

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
  } catch (e) {
    toast('Kaydedilemedi, tarayıcı hafızası dolu veya kapalı');
  }
}

function toast(m) {
  const t = $('#toast');
  if (!t) return;
  t.textContent = m;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

function weekDate(dow) {
  const n = new Date();
  const mondayOffset = (n.getDay() + 6) % 7;
  const targetOffset = ORDER.indexOf(dow);
  return fmtD(new Date(n.getFullYear(), n.getMonth(), n.getDate() - mondayOffset + targetOffset));
}

let day = new Date().getDay();
let view = 'w';
const vd = () => weekDate(day);

function setScreen(mode) {
  const showIn = mode === 'intro';
  if ($('#intro')) $('#intro').hidden = !showIn;
  if ($('#app')) $('#app').hidden = showIn;
  if (!showIn) render();
}

function sets(id) {
  const t = vd();
  const L = S.logs[t] || (S.logs[t] = {});
  if (!Array.isArray(L[id]) || !L[id].length) {
    L[id] = [{k: '', r: ''}, {k: '', r: ''}, {k: '', r: ''}];
  }
  return L[id];
}

function last(id) {
  const t = vd();
  const ds = Object.keys(S.logs).filter(d => d < t && S.logs[d] && Array.isArray(S.logs[d][id]) && S.logs[d][id].some(valid)).sort();
  if (!ds.length) return null;
  const d = ds[ds.length - 1];
  const v = S.logs[d][id].filter(valid);
  const best = v.reduce((a, s) => Number(s.k) >= Number(a.k) ? s : a);
  return {d, n: v.length, b: best};
}

function rowH(s, i, L) {
  return `<div class="row"><span>${i + 1}</span>
    <input type="text" inputmode="decimal" data-i="${i}" data-f="k" value="${esc(s.k)}" placeholder="${L ? esc(L.b.k) : '0'}" aria-label="Ağırlık kg">
    <input type="text" inputmode="numeric" data-i="${i}" data-f="r" value="${esc(s.r)}" placeholder="${L ? esc(L.b.r) : '0'}" aria-label="Tekrar">
    <button class="rm" type="button" data-a="rs" data-i="${i}" aria-label="Seti sil">−</button></div>`;
}

function render() {
  const mChanged = syncPastMissed(S);
  const wChanged = syncWeeklySnapshots(S);
  if (mChanged || wChanged) save();

  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  if ($('#wv')) $('#wv').hidden = view !== 'w';
  if ($('#hv')) $('#hv').hidden = view !== 'h';
  if ($('#bv')) $('#bv').hidden = view !== 'b';

  const tdDow = new Date().getDay();
  const tdOff = isOffDay(tdDow, S);
  const tt = S.days[tdDow].title;
  if ($('#date')) {
    $('#date').textContent = new Date().toLocaleDateString('tr-TR', {weekday: 'long', day: 'numeric', month: 'long'}) +
      (tdOff ? ' · Off day' : (tt ? ', bugün: ' + tt : ''));
  }

  if (view === 'h') return hist();
  if (view !== 'w') return;

  const D = S.days[day];
  const dt = vd();
  const td = today();
  const isToday = dt === td;
  const off = isOffDay(day, S);
  const x = S.done[dt];

  if ($('#dh')) {
    $('#dh').textContent = DF[day] + ', ' +
      new Date(dt + 'T12:00:00').toLocaleDateString('tr-TR', {day: 'numeric', month: 'long'}) +
      (isToday ? ' (bugün)' : '') +
      (off ? ' — Off day' : '');
  }

  if ($('#tabs')) {
    $('#tabs').innerHTML = ORDER.map(d => {
      const k = weekDate(d);
      const y = S.done[k];
      const dOff = isOffDay(d, S);
      const c = y ? (y.s === 'done' ? 'ok' : 'no') : '';
      const mark = y ? (y.s === 'done' ? '✓' : '✗') : (dOff ? '—' : (k === td ? '•' : ''));
      return `<button type="button" data-d="${d}" class="${d === day ? 'on ' : ''}${c}">${DN[d]}<small>${mark}</small></button>`;
    }).join('');
  }

  if ($('#wt')) $('#wt').value = D.title;

  if ($('#st')) {
    if (off) {
      $('#st').innerHTML = `<div class="offtag">Off day — Bu gün için planlı antrenman yok</div>`;
    } else if (isToday) {
      const isDone = x && x.s === 'done';
      $('#st').innerHTML = `<div class="stb"><button type="button" data-a="done" class="${isDone ? 'on' : ''}">${isDone ? '✓ Bugün yapıldı' : '✓ Antrenmanı yaptım'}</button></div>`;
    } else if (dt < td) {
      const isDone = x && x.s === 'done';
      $('#st').innerHTML = `<div class="stb"><button type="button" disabled class="${isDone ? 'on' : 'off'}">${isDone ? '✓ Yapıldı' : '✗ Yapılmadı'}</button></div>`;
    } else {
      $('#st').innerHTML = `<div class="stb"><button type="button" disabled>Sadece kendi gününde işaretlenir</button></div>`;
    }
  }

  if ($('#list')) {
    $('#list').innerHTML = D.ids.length ? D.ids.map(id => {
      const L = last(id);
      const a = sets(id);
      const lt = L
        ? `Son (${new Date(L.d + 'T12:00:00').toLocaleDateString('tr-TR', {day: 'numeric', month: 'short'})}): ${L.b.k} kg × ${L.b.r} tekrar, ${L.n} set`
        : 'İlk kez, henüz kayıt yok';
      const pv = L && S.logs[L.d] && S.logs[L.d][id] ? vol(S.logs[L.d][id]) : 0;
      return `<div class="card" data-id="${id}" data-pv="${pv}">
        <div class="ch"><b>${esc(S.names[id] || 'Hareket')}</b><button type="button" class="x" data-a="del" aria-label="Hareketi sil">✕</button></div>
        <div class="last">${lt}</div>
        <div class="cap"><span>Set</span><span>Kg</span><span>Tekrar</span><span></span></div>
        ${a.map((s, i) => rowH(s, i, L)).join('')}
        <div class="ft"><span>Hacim <b class="v">0 kg</b></span><span>1RM <b class="m">–</b></span><span class="dl"></span><button type="button" class="as" data-a="as">+ Set</button></div>
      </div>`;
    }).join('') : '<div class="sub" style="text-align:center;padding:22px">Bu gün boş (Off day). Üstten antrenman adı yazıp aşağıdan hareket ekleyebilirsiniz.</div>';
  }

  upd();
}

function wkHTML() {
  let pl = 0, dn = 0, v = 0;
  ORDER.forEach(d => {
    const k = weekDate(d);
    const x = S.done[k];
    const off = isOffDay(d, S);
    if (!off || (x && x.s === 'done')) pl++;
    if (x && x.s === 'done') dn++;
    const dayLogs = S.logs[k] || {};
    for (const id in dayLogs) {
      if (Array.isArray(dayLogs[id])) v += vol(dayLogs[id]);
    }
  });
  const C = 2 * Math.PI * 22;
  const p = pl ? dn / pl : 0;
  return `<svg class="rg" viewBox="0 0 56 56"><circle cx="28" cy="28" r="22" class="rb"/>${dn ? `<circle cx="28" cy="28" r="22" class="rf" stroke-dasharray="${C * p} ${C}" transform="rotate(-90 28 28)"/>` : ''}<text x="28" y="33" text-anchor="middle">${dn}/${pl}</text></svg>
  <div><b>Bu hafta</b><div class="ht">${dn} antrenman tamamlandı${v ? ', ' + f1(v) + ' kg hacim' : ''}</div></div>`;
}

function upd() {
  let T = 0;
  document.querySelectorAll('#list .card').forEach(c => {
    const id = c.dataset.id;
    if (!id) return;
    const a = sets(id);
    const v = vol(a);
    const m = rm(a);
    T += v;

    const vEl = c.querySelector('.v');
    const mEl = c.querySelector('.m');
    if (vEl) vEl.textContent = f1(v) + ' kg';
    if (mEl) mEl.textContent = m ? f1(m) + ' kg' : '–';

    const pv = Number(c.dataset.pv) || 0;
    const e = c.querySelector('.dl');
    if (e) {
      if (pv && v) {
        const diff = Math.round((v - pv) / pv * 100);
        e.textContent = (diff >= 0 ? '▲ +' : '▼ −') + Math.abs(diff) + '%';
        e.className = 'dl ' + (diff >= 0 ? 'up' : 'dn');
      } else {
        e.textContent = '';
        e.className = 'dl';
      }
    }
  });

  if ($('#total')) $('#total').textContent = f1(T) + ' kg';
  if ($('#wk')) $('#wk').innerHTML = wkHTML();
}

function pctBadge(cur, prev) {
  if (!prev) return cur > 0 ? '<span class="dl up">Yeni</span>' : '<span class="sub">–</span>';
  const diff = Math.round(((cur - prev) / prev) * 100);
  if (diff > 0) return `<span class="dl up">▲ +${diff}%</span>`;
  if (diff < 0) return `<span class="dl dn">▼ ${diff}%</span>`;
  return '<span class="sub">0%</span>';
}

function barRow(label, valNum, maxNum, formattedVal, isPrev) {
  const pct = maxNum > 0 ? Math.max(0, Math.min(100, Math.round((valNum / maxNum) * 100))) : 0;
  return `<div class="bar-line">
    <span class="bar-lbl">${label}</span>
    <div class="bar-track"><div class="bar-fill${isPrev ? ' prev' : ''}" style="width:${pct}%"></div></div>
    <span class="bar-val">${formattedVal}</span>
  </div>`;
}

function buildWeeklyAdvice(curW, prevW) {
  const tips = [];

  if (curW.totalVol === 0 && prevW.totalVol === 0 && curW.doneCount === 0) {
    tips.push('Henüz set veya antrenman kaydı görünmüyor. Haftanın günlerine antrenman adı ve hareket ekleyip set girmeye başladığınızda kıyaslama ve öneriler burada oluşacak.');
    return tips;
  }

  if (prevW.totalVol > 0) {
    const volDiff = Math.round(((curW.totalVol - prevW.totalVol) / prevW.totalVol) * 100);
    if (volDiff >= 25) {
      tips.push(`Toplam hacmin geçen haftaya göre %${volDiff} arttı. Ani yük sıçramasına karşı önümüzdeki hafta artışı %5–10 bandında tutmak toparlanmayı korur.`);
    } else if (volDiff > 0) {
      tips.push(`Toplam hacmin geçen haftaya göre %${volDiff} yükseldi; kademeli yük artışı iyi ilerliyor. Aynı tekniği koruyarak setlerde RIR 1–2 civarında kalabilirsin.`);
    } else if (volDiff < -15) {
      tips.push(`Toplam hacim geçen haftaya göre %${Math.abs(volDiff)} düştü. Bilinçli bir deload/toparlanma haftası değilse eksik set veya günleri kontrol edebilirsin.`);
    } else if (volDiff < 0) {
      tips.push(`Toplam hacim geçen haftanın %${Math.abs(volDiff)} altında. Bir sonraki antrenmanda ana hareketlerde +1 tekrar veya ekstra kontrollü set ekleyebilirsin.`);
    } else {
      tips.push('Toplam hacim geçen haftayla neredeyse aynı. İlerleme için seçili ana hareketlerde küçük ağırlık artışı veya +1–2 tekrar deneyebilirsin.');
    }
  } else if (curW.totalVol > 0) {
    tips.push(`Bu hafta ${f1(curW.totalVol)} kg toplam hacim kaydedildi. Önümüzdeki hafta bu değeri baz alıp kademeli olarak üzerine koymayı hedefleyebilirsin.`);
  }

  if (prevW.peakRm > 0 && curW.peakRm > 0) {
    if (curW.peakRm > prevW.peakRm) {
      tips.push(`En yüksek 1RM değerin geçen haftaki ${f1(prevW.peakRm)} kg seviyesinden ${f1(curW.peakRm)} kg'a çıktı; kuvvet/performans yönünde olumlu gelişim var.`);
    } else if (curW.totalVol > prevW.totalVol && curW.peakRm === prevW.peakRm) {
      tips.push('Hacmin artarken tepe 1RM aynı kaldı; daha çok toplam iş yükü veya yüksek tekrarlı setler öne çıkmış.');
    }
  }

  if (curW.plannedCount > 0 && curW.doneCount === curW.plannedCount) {
    tips.push(`Bu haftaki planlı antrenmanların tamamını (${curW.doneCount}/${curW.plannedCount}) tamamladın; istikrar gelişimin en güçlü desteği.`);
  }

  let offCountWeek = 0;
  for (let d = 0; d < 7; d++) {
    if (isOffDay(d, S)) offCountWeek++;
  }
  if (offCountWeek === 0 && curW.doneCount >= 5) {
    tips.push('Haftada hiç Off day görünmüyor. Eklem ve sinir sistemi yorgunluğunu önlemek için haftaya en az 2 Off day bırakmak iyi olabilir.');
  } else if (offCountWeek >= 3 && curW.doneCount >= 3) {
    tips.push(`Haftada ${offCountWeek} Off day ve ${curW.doneCount} antrenman dengesi toparlanma açısından sağlıklı bir ritim sunuyor.`);
  }

  const now = new Date();
  let recentSkips = 0;
  for (let i = 1; i <= 14; i++) {
    const k = fmtD(new Date(now.getFullYear(), now.getMonth(), now.getDate() - i));
    if (S.done && S.done[k] && S.done[k].s === 'skip') recentSkips++;
  }
  if (recentSkips >= 3) {
    tips.push(`Son 14 günde ${recentSkips} antrenman günü "Yapılmadı" olarak işlenmiş. Hedef gün sayısını azaltmak veya antrenman saatini sabitlemek devamlılığı artırabilir.`);
  }

  return tips.slice(0, 4);
}

function compareHTML() {
  syncWeeklySnapshots(S);
  const now = new Date();
  const curMon = getMondayDate(now);
  const prevMon = new Date(curMon.getFullYear(), curMon.getMonth(), curMon.getDate() - 7);

  const curW = S.weekly[fmtD(curMon)] || buildWeekSummary(curMon, S);
  const prevW = S.weekly[fmtD(prevMon)] || buildWeekSummary(prevMon, S);

  const maxVol = Math.max(curW.totalVol, prevW.totalVol, 1);
  const maxRm = Math.max(curW.peakRm, prevW.peakRm, 1);
  const maxDone = Math.max(curW.doneCount, prevW.doneCount, curW.plannedCount, 1);
  const tips = buildWeeklyAdvice(curW, prevW);

  return `
    <div class="cmp-top">
      <b>Haftalık Gelişim Kıyaslaması</b>
      <span class="sub">Bu Hafta vs Önceki</span>
    </div>

    <div class="cmp-metric">
      <div class="cmp-row-hd"><span>Toplam Hacim</span>${pctBadge(curW.totalVol, prevW.totalVol)}</div>
      <div class="cmp-bars">
        ${barRow('Bu hafta', curW.totalVol, maxVol, f1(curW.totalVol) + ' kg', false)}
        ${barRow('Önceki', prevW.totalVol, maxVol, f1(prevW.totalVol) + ' kg', true)}
      </div>
    </div>

    <div class="cmp-metric">
      <div class="cmp-row-hd"><span>Tamamlanan Antrenman</span>${pctBadge(curW.doneCount, prevW.doneCount)}</div>
      <div class="cmp-bars">
        ${barRow('Bu hafta', curW.doneCount, maxDone, curW.doneCount + ' gün', false)}
        ${barRow('Önceki', prevW.doneCount, maxDone, prevW.doneCount + ' gün', true)}
      </div>
    </div>

    <div class="cmp-metric">
      <div class="cmp-row-hd"><span>En Yüksek 1RM</span>${pctBadge(curW.peakRm, prevW.peakRm)}</div>
      <div class="cmp-bars">
        ${barRow('Bu hafta', curW.peakRm, maxRm, curW.peakRm ? f1(curW.peakRm) + ' kg' : '–', false)}
        ${barRow('Önceki', prevW.peakRm, maxRm, prevW.peakRm ? f1(prevW.peakRm) + ' kg' : '–', true)}
      </div>
    </div>

    <div class="adv-box">
      <div class="adv-title">Haftalık Yorum ve Öneriler</div>
      <ul class="adv-list">
        ${tips.map(t => `<li>${esc(t)}</li>`).join('')}
      </ul>
    </div>
  `;
}

function savedWeeksHTML() {
  const keys = Object.keys(S.weekly || {}).sort().reverse();
  if (!keys.length) return '<div class="sub" style="text-align:center;padding:16px">Henüz kaydedilmiş haftalık özet yok.</div>';
  return keys.map(k => {
    const w = S.weekly[k];
    const rangeLabel = `${new Date(w.start + 'T12:00:00').toLocaleDateString('tr-TR', {day: 'numeric', month: 'short'})} – ${new Date(w.end + 'T12:00:00').toLocaleDateString('tr-TR', {day: 'numeric', month: 'short'})}`;
    const tag = w.finished ? 'Tamamlandı' : 'Devam ediyor';
    return `<div class="wk-log-item">
      <div class="wk-log-hd"><b>${rangeLabel}</b><span class="sub">${tag}</span></div>
      <div class="wk-log-meta">Antrenman: <b>${w.doneCount}</b> · Hacim: <b>${f1(w.totalVol)} kg</b> · En yüksek 1RM: <b>${w.peakRm ? f1(w.peakRm) + ' kg' : '–'}</b></div>
    </div>`;
  }).join('');
}

function heat() {
  const n = new Date();
  const off = (n.getDay() + 6) % 7;
  const td = today();
  let h = '';
  for (let i = 0; i < 35; i++) {
    const dt = new Date(n.getFullYear(), n.getMonth(), n.getDate() - off - 28 + i);
    const k = fmtD(dt);
    const w = dt.getDay();
    const x = S.done[k];
    const dOff = isOffDay(w, S);
    let c = '';
    if (k > td) c = 'fu';
    else if (x) c = x.s === 'done' ? 'ok' : 'no';
    else if (dOff) c = 'od';
    else if (k >= S.since) c = k === td ? 'td' : 'ms';
    h += `<i class="${c}" title="${k}"></i>`;
  }
  return `<div class="hmh">${ORDER.map(d => '<span>' + DN[d] + '</span>').join('')}</div><div class="hm">${h}</div>
  <div class="lgd"><span>Yapıldı</span><span class="no">Yapılmadı</span><span class="od">Off day</span><span class="ms">İşaretlenmedi</span></div>`;
}

function hist() {
  if ($('#cmp')) $('#cmp').innerHTML = compareHTML();
  if ($('#hm')) $('#hm').innerHTML = heat();
  const n = new Date();
  const rows = [];
  let pl = 0, dn = 0;

  for (let i = 0; i < 35; i++) {
    const dt = new Date(n.getFullYear(), n.getMonth(), n.getDate() - i);
    const k = fmtD(dt);
    const w = dt.getDay();
    const x = S.done[k];
    const dOff = isOffDay(w, S);

    if (k < S.since && !x && i > 0) continue;

    let v = 0;
    const dayLogs = S.logs[k] || {};
    for (const id in dayLogs) {
      if (Array.isArray(dayLogs[id])) v += vol(dayLogs[id]);
    }

    if (dOff && (!x || x.s !== 'done')) {
      rows.push(`<div class="hr"><div><b>${DF[w]}</b><span class="d">${dt.toLocaleDateString('tr-TR', {day: 'numeric', month: 'short'})}</span>
        <div class="ht">Off day${v ? ', ' + f1(v) + ' kg hacim' : ''}</div></div><span class="bd off">Off day</span></div>`);
      continue;
    }

    const title = (x && x.t) || S.days[w].title || 'Antrenman';
    const st = x ? x.s : (i === 0 ? 'wait' : 'skip');
    if (st !== 'wait') {
      pl++;
      if (st === 'done') dn++;
    }
    const lb = {done: 'Yapıldı', skip: 'Yapılmadı', miss: 'İşaretlenmedi', wait: 'Bugün'}[st] || 'Yapılmadı';
    rows.push(`<div class="hr"><div><b>${DF[w]}</b><span class="d">${dt.toLocaleDateString('tr-TR', {day: 'numeric', month: 'short'})}</span>
      <div class="ht">${esc(title)}${v ? ', ' + f1(v) + ' kg hacim' : ''}</div></div><span class="bd ${st}">${lb}</span></div>`);
  }

  if ($('#hs')) $('#hs').textContent = pl ? `Son 5 hafta: ${pl} planlı antrenmanın ${dn} tanesi yapıldı` : 'Henüz kayıt yok';
  if ($('#hl')) $('#hl').innerHTML = rows.join('') || '<div class="sub" style="text-align:center;padding:22px">Geçmiş kayıt bulunmuyor.</div>';
  if ($('#wkl')) $('#wkl').innerHTML = savedWeeksHTML();
}

/* Olaylar */
if ($('#intro')) {
  $('#intro').onclick = e => {
    if (e.target.closest('#startApp') || !e.target.closest('.in-center')) {
      setScreen('app');
    }
  };
}
if ($('#startApp')) $('#startApp').onclick = e => { e.stopPropagation(); setScreen('app'); };

if ($('#seg')) {
  $('#seg').onclick = e => {
    const b = e.target.closest('button');
    if (b && b.dataset.v) {
      view = b.dataset.v;
      render();
    }
  };
}

if ($('#tabs')) {
  $('#tabs').onclick = e => {
    const b = e.target.closest('button');
    if (b && b.dataset.d !== undefined) {
      day = Number(b.dataset.d);
      render();
    }
  };
}

if ($('#wt')) {
  $('#wt').oninput = e => {
    S.days[day].title = e.target.value;
    syncWeeklySnapshots(S);
    save();
  };
  $('#wt').onchange = render;
}

if ($('#st')) {
  $('#st').onclick = e => {
    const b = e.target.closest('[data-a="done"]');
    if (!b || b.disabled) return;
    const dt = vd();
    if (dt !== today()) {
      toast('Sadece bugünkü antrenman işaretlenebilir');
      return;
    }
    if (isOffDay(day, S)) {
      toast('Bu gün Off day olarak görünüyor');
      return;
    }
    const x = S.done[dt];
    if (x && x.s === 'done') delete S.done[dt];
    else S.done[dt] = {s: 'done', k: day, t: S.days[day].title || DF[day]};
    syncWeeklySnapshots(S);
    save();
    render();
  };
}

if ($('#list')) {
  $('#list').addEventListener('input', e => {
    const i = e.target;
    if (!i.dataset.f) return;
    const card = i.closest('.card');
    if (!card || !card.dataset.id) return;
    sets(card.dataset.id)[Number(i.dataset.i)][i.dataset.f] = i.value.replace(',', '.');
    syncWeeklySnapshots(S);
    save();
    upd();
  });

  $('#list').addEventListener('click', e => {
    const b = e.target.closest('[data-a]');
    if (!b) return;
    const card = b.closest('.card');
    if (!card || !card.dataset.id) return;
    const id = card.dataset.id;
    const a = b.dataset.a;
    if (a === 'as') {
      const s = sets(id);
      const p = s[s.length - 1] || {k: '', r: ''};
      s.push({k: p.k, r: p.r});
    } else if (a === 'rs') {
      const s = sets(id);
      if (s.length > 1) s.splice(Number(b.dataset.i), 1);
    } else if (a === 'del') {
      if (!confirm('“' + (S.names[id] || 'Hareket') + '” bu günün programından silinsin mi? Geçmiş kayıtların korunur.')) return;
      S.days[day].ids = S.days[day].ids.filter(x => x !== id);
    }
    syncWeeklySnapshots(S);
    save();
    render();
  });
}

if ($('#addf')) {
  $('#addf').addEventListener('submit', e => {
    e.preventDefault();
    const inp = $('#newEx');
    if (!inp) return;
    const n = inp.value.trim();
    if (!n) return;
    const id = uid();
    S.names[id] = n;
    S.days[day].ids.push(id);
    inp.value = '';
    syncWeeklySnapshots(S);
    save();
    render();
  });
}

/* Dinlenme sayacı */
let end = 0, iv = null, ac = null, tot = 1;
const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
const ring = f => {
  const tr = $('#tr');
  if (tr) tr.setAttribute('stroke-dasharray', (f * 150.8) + ' 151');
};

function beep() {
  try {
    if (!ac) return;
    [0, 0.4, 0.8].forEach(t => {
      const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime + t;
      o.frequency.value = 880;
      o.connect(g);
      g.connect(ac.destination);
      g.gain.setValueAtTime(0.35, n);
      g.gain.exponentialRampToValueAtTime(0.001, n + 0.3);
      o.start(n);
      o.stop(n + 0.3);
    });
  } catch (e) {}
}

let wl = null, al = null, at = null;
async function lock() {
  try {
    if (navigator.wakeLock) wl = await navigator.wakeLock.request('screen');
  } catch (e) {}
}
function unlock() {
  try {
    if (wl) wl.release();
  } catch (e) {}
  wl = null;
}
const vib = () => {
  if (navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 500]);
};
function dismiss() {
  clearInterval(al);
  clearTimeout(at);
  al = null;
  if ($('#ov')) $('#ov').hidden = true;
  if (navigator.vibrate) navigator.vibrate(0);
}
function alarm() {
  if ($('#ov')) $('#ov').hidden = false;
  beep();
  vib();
  clearInterval(al);
  clearTimeout(at);
  al = setInterval(() => { beep(); vib(); }, 2500);
  at = setTimeout(dismiss, 60000);
}
function stop() {
  if ($('#tmr')) $('#tmr').classList.remove('run');
  unlock();
  clearInterval(iv);
  iv = null;
  document.querySelectorAll('.ti [data-s]').forEach(b => b.classList.remove('on'));
}
function tick() {
  const l = Math.ceil((end - Date.now()) / 1000);
  if (l <= 0) {
    stop();
    if ($('#tm')) $('#tm').textContent = '00:00';
    ring(0);
    alarm();
    return;
  }
  if ($('#tm')) $('#tm').textContent = fmt(l);
  ring(l / tot);
}

document.querySelectorAll('.ti [data-s]').forEach(b => {
  b.onclick = () => {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      ac.resume();
    } catch (e) {}
    stop();
    dismiss();
    lock();
    tot = Number(b.dataset.s);
    if ($('#tmr')) $('#tmr').classList.add('run');
    b.classList.add('on');
    end = Date.now() + tot * 1000;
    tick();
    iv = setInterval(tick, 250);
  };
});

if ($('#stop')) {
  $('#stop').onclick = () => {
    stop();
    if ($('#tm')) $('#tm').textContent = '00:00';
    ring(0);
  };
}
if ($('#ovok')) $('#ovok').onclick = dismiss;
document.addEventListener('visibilitychange', () => {
  if (iv) {
    tick();
    lock();
  }
});

/* Yedekleme */
function dl(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function clean() {
  syncWeeklySnapshots(S);
  const logs = {};
  for (const d in S.logs) {
    const o = {};
    for (const id in S.logs[d]) {
      if (Array.isArray(S.logs[d][id])) {
        const v = S.logs[d][id].filter(valid);
        if (v.length) o[id] = v;
      }
    }
    if (Object.keys(o).length) logs[d] = o;
  }
  return {app: 'spor-takip', v: 3, days: S.days, names: S.names, logs, done: S.done, weekly: S.weekly, since: S.since};
}

const f1c = n => String(Math.round(n * 10) / 10);
const LBK = 'spor-takip-lastbackup';

function showLB() {
  let t = null;
  try {
    t = localStorage.getItem(LBK);
  } catch (e) {}
  const lb = $('#lb');
  if (lb) {
    lb.textContent = t
      ? 'Son yedek: ' + new Date(t).toLocaleString('tr-TR', {day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit'})
      : 'Henüz yedek alınmadı';
  }
}

if ($('#ej')) {
  $('#ej').onclick = () => {
    dl('spor-yedek-' + today() + '.json', JSON.stringify(clean(), null, 2), 'application/json');
    try {
      localStorage.setItem(LBK, new Date().toISOString());
    } catch (e) {}
    showLB();
    toast('Yedek indirildi');
  };
}
showLB();

function csvText() {
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  const rows = ['Tarih,Gün,Antrenman,Durum,Hareket,Set,Kg,Tekrar,Hacim,1RM'];
  const c = clean();
  const dates = [...new Set([...Object.keys(c.logs), ...Object.keys(c.done)])].sort();
  dates.forEach(d => {
    const w = new Date(d + 'T12:00:00').getDay();
    const x = c.done[d];
    const t = x ? x.t : (isOffDay(w, c) ? 'Off day' : c.days[w].title);
    const st = x ? (x.s === 'done' ? 'Yapıldı' : 'Yapılmadı') : (isOffDay(w, c) ? 'Off day' : '');
    const L = c.logs[d] || {};
    const ids = Object.keys(L);
    if (!ids.length) rows.push([d, DF[w], q(t), st, '', '', '', '', '', ''].join(','));
    ids.forEach(id => L[id].forEach((s, i) => {
      const k = Number(s.k), r = Number(s.r);
      rows.push([d, DF[w], q(t), st, q(S.names[id] || id), i + 1, s.k, s.r, f1c(k * r), f1c(r === 1 ? k : k * (1 + r / 30))].join(','));
    }));
  });
  return '\ufeff' + rows.join('\n');
}

if ($('#ec')) $('#ec').onclick = () => dl('spor-yedek-' + today() + '.csv', csvText(), 'text/csv;charset=utf-8');

if ($('#imp')) {
  $('#imp').onchange = async e => {
    const f = e.target.files[0];
    if (!f) return;
    try {
      const d = mig(JSON.parse(await f.text()));
      if (!d) throw new Error('invalid');
      if (!confirm('Mevcut veriler yedekteki verilerle değiştirilsin mi?')) return;
      S = d;
      syncPastMissed(S);
      syncWeeklySnapshots(S);
      save();
      render();
      toast('Yedek yüklendi');
    } catch (x) {
      toast('Geçersiz yedek dosyası');
    }
    e.target.value = '';
  };
}

save();
setScreen('intro');
</script>
